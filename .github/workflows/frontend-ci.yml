name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# Prevent redundant parallel runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Resolved in each job via the "Resolve env defaults" step
  NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

# ─── REUSABLE ENV SETUP ────────────────────────────────────────────────────
# Extracted as a shell snippet referenced by every job.
# GH Actions does not support real anchors, so the step is duplicated
# but kept intentionally short.

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Quality Gate
  # Blocks every downstream job. Must pass before E2E or deploy can start.
  # ══════════════════════════════════════════════════════════════════════════
  quality:
    name: Quality Gate (lint · typecheck · test · build · audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve env defaults
        shell: bash
        run: |
          [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]] && \
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          [[ -z "${NEXT_PUBLIC_APP_URL}" ]] && \
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit & integration tests (Vitest)
        run: npm run test

      - name: Isolated production build
        run: npm run build:isolated

      - name: Dependency audit (high + critical)
        run: npm audit --audit-level=high

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-standalone
          path: |
            .next-build/standalone
            .next-build/static
          if-no-files-found: error
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — E2E: xs-mobile (375×812) — primary functional + security gate
  # Runs the full Playwright suite scoped to the xs-mobile project.
  # Includes: auth, session, portfolio, transactions, OAuth2, security specs.
  # ══════════════════════════════════════════════════════════════════════════
  e2e-xs:
    name: E2E — xs-mobile (375×812)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve env defaults
        shell: bash
        run: |
          [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]] && \
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          [[ -z "${NEXT_PUBLIC_APP_URL}" ]] && \
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      # All Playwright projects use Chromium (Pixel 5 + plain viewports).
      # Install only chromium to keep CI install fast.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright — xs-mobile
        run: npx playwright test --project=xs-mobile
        env:
          CI: "true"

      # Report is uploaded always so failures are reviewable in GitHub UI.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-xs-mobile
          path: playwright-report/
          retention-days: 14

      # Traces + screenshots + videos only on failure to save storage.
      - name: Upload test traces and evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-xs-mobile
          path: test-results/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 — E2E: Responsive density (all 5 breakpoints)
  # Validates Fintech Density rules across xs/sm/md/lg/xl viewports.
  # Runs only settings-responsive-density.spec.ts to keep runtime bounded.
  # ══════════════════════════════════════════════════════════════════════════
  e2e-responsive:
    name: E2E — Responsive density (xs → xl)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve env defaults
        shell: bash
        run: |
          [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]] && \
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          [[ -z "${NEXT_PUBLIC_APP_URL}" ]] && \
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run responsive density spec (all projects)
        run: npx playwright test tests/e2e/settings-responsive-density.spec.ts
        env:
          CI: "true"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-responsive
          path: playwright-report/
          retention-days: 14

      - name: Upload test traces and evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-responsive
          path: test-results/
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Security: Snyk (optional — requires SNYK_TOKEN secret)
  # Only runs when the secret is configured. Fails CI on high/critical CVEs.
  # To activate: Settings → Secrets → SNYK_TOKEN = <token from app.snyk.io>
  # ══════════════════════════════════════════════════════════════════════════
  security-snyk:
    name: Security — Snyk dependency scan
    runs-on: ubuntu-latest
    needs: quality
    # Skip gracefully when the org hasn't wired up Snyk yet.
    if: ${{ secrets.SNYK_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snyk — test (high + critical threshold)
        run: npx snyk test --severity-threshold=high --org=${{ vars.SNYK_ORG_ID }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk — monitor (track in dashboard)
        # Only track on pushes to main; PRs should only test, not pollute the dashboard.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx snyk monitor --org=${{ vars.SNYK_ORG_ID }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 5 — Container smoke (Docker build + HTTP health check)
  # Only runs after quality gate AND xs-mobile E2E pass to avoid wasted
  # Docker builds on broken code.
  # ══════════════════════════════════════════════════════════════════════════
  container-smoke:
    name: Container smoke (Docker build + /login health)
    runs-on: ubuntu-latest
    needs: [quality, e2e-xs]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve env defaults
        shell: bash
        run: |
          [[ -z "${NEXT_PUBLIC_API_BASE_URL}" ]] && \
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          [[ -z "${NEXT_PUBLIC_APP_URL}" ]] && \
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
            -t crypto-portfolio-monitoring-frontend:ci .

      - name: Start container
        run: |
          docker run -d --rm \
            --name cpm-frontend-ci \
            -p 3000:3000 \
            -e NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            -e NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
            crypto-portfolio-monitoring-frontend:ci

      - name: Wait for app to be ready
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              echo "App ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in 60s"
          docker logs cpm-frontend-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop cpm-frontend-ci
