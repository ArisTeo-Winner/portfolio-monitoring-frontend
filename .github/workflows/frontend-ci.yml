name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve workflow env
        shell: bash
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          fi
          if [ -z "${NEXT_PUBLIC_APP_URL}" ]; then
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build:isolated

      - name: Upload isolated build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-standalone
          path: |
            .next-build/standalone
            .next-build/static
          if-no-files-found: error

  container-smoke:
    runs-on: ubuntu-latest
    needs: verify
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve workflow env
        shell: bash
        run: |
          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "NEXT_PUBLIC_API_BASE_URL=https://crypto-portfolio-monitoring.onrender.com" >> "$GITHUB_ENV"
          fi
          if [ -z "${NEXT_PUBLIC_APP_URL}" ]; then
            echo "NEXT_PUBLIC_APP_URL=https://frontend-staging.example.com" >> "$GITHUB_ENV"
          fi

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            --build-arg NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
            -t crypto-portfolio-monitoring-frontend:ci .

      - name: Start container
        run: |
          docker run -d --rm \
            --name cpm-frontend-ci \
            -p 3000:3000 \
            -e NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" \
            -e NEXT_PUBLIC_APP_URL="${NEXT_PUBLIC_APP_URL}" \
            crypto-portfolio-monitoring-frontend:ci

      - name: Wait for app
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          docker logs cpm-frontend-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker stop cpm-frontend-ci
